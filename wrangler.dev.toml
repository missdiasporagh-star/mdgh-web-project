name = "mdgh-web-project"
compatibility_date = "2025-11-12"
compatibility_flags = ["nodejs_compat"]
# NOTE: This file is intentionally NOT a Pages-config wrangler.toml. The
# `pages_build_output_dir` line that would trigger Cloudflare Pages's BETA
# wrangler.toml integration was removed because that beta path was wrapping
# the deployed Astro 5 worker in a way that returned literal "[object Object]"
# bodies for every request. Bindings (D1/R2/KV) and env vars below are kept
# ONLY for local `wrangler pages dev dist` use. In production, bindings are
# configured via the Cloudflare Pages dashboard (Settings → Functions →
# Bindings) — that path doesn't go through the broken beta detection.
#
# `account_id` is NOT supported in Pages-style wrangler.toml even when this
# file is non-Pages-mode; for multi-account wrangler logins, set
# CLOUDFLARE_ACCOUNT_ID env var instead.

# D1 database — created via `wrangler d1 create mdgh-applications-db` on 2026-05-06
[[d1_databases]]
binding = "DB"
database_name = "mdgh-applications-db"
database_id = "0ab44066-071a-4232-acb8-83bb48a32cb3"

# R2 bucket (production maps in pages dashboard; this is for local wrangler pages dev)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mdgh-applications-staging"

# KV namespace — bound as KV (NOT "SESSION", which Astro 5 auto-detects and
# overlays with its own session-cookie middleware that mangles SSR response
# bodies). Same underlying namespace; binding name change only.
[[kv_namespaces]]
binding = "KV"
id = "e617b51f080c451abe6aade5373fcf6d"

# Local dev variables (never put real secrets here; use .dev.vars)
[vars]
PAYAZA_BASE_URL = "https://sandbox-api.payaza.africa"
R2_ACCOUNT_ID = "233d917842862e30ed5207cf7b95bc33"
